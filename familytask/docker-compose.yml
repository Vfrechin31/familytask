services:
  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      # Transmise au conteneur pour que vite.config.js sache s'il tourne dans
      # un codespace (adresse en .app.github.dev) ou en local (localhost).
      CODESPACES: ${CODESPACES:-}
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://familytask:familytask@db:5432/familytask
      OLLAMA_URL: http://ollama:11434/v1/chat/completions
      # qwen2.5:1.5b : le plus gros modèle qui tienne sans planter dans la RAM limitée de cet
      # environnement de dev (les modèles 3B font crasher le serveur d'inférence par manque de mémoire)
      OLLAMA_MODEL: qwen2.5:1.5b
    depends_on:
      - db
      - ollama
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: familytask
      POSTGRES_PASSWORD: familytask
      POSTGRES_DB: familytask
    volumes:
      - pgdata:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    # Pas de port publié vers l'hôte : seul le backend y accède, via le réseau interne docker compose

# ---------------------------------------------------------------------------
# GitHub Models (utilisé initialement pour l'assistant IA) a été définitivement
# retiré le 30 juillet 2026. L'assistant tourne désormais sur un modèle local
# via Ollama, gratuit et sans clé. Revers de la médaille : plus lent (CPU) et
# le conteneur ollama doit être présent au déploiement (ce qui avait justifié
# GitHub Models à l'origine, sur le plan gratuit de Render notamment).
# ---------------------------------------------------------------------------

volumes:
  pgdata:
  ollama_data:
