# Fichier de configuration Render (Blueprint) : décrit les ressources à déployer
# https://render.com/docs/blueprint-spec

databases:
  # Base de données PostgreSQL utilisée par le backend FamilyTask
  - name: familytask-db
    plan: free

services:
  # API backend FastAPI de FamilyTask
  - type: web
    name: familytask-api
    runtime: python
    plan: free
    rootDir: familytask/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # URL de connexion injectée automatiquement par Render depuis la base familytask-db
      - key: DATABASE_URL
        fromDatabase:
          name: familytask-db
          property: connectionString
      # Secret à renseigner manuellement dans le dashboard Render (jamais écrit dans ce fichier)
      - key: AI_TOKEN
        sync: false

  # Site statique frontend de FamilyTask (build Vite)
  - type: web
    name: familytask-front
    env: static
    rootDir: familytask/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Adresse de l'API injectée automatiquement par Render depuis le service familytask-api
      - key: VITE_API_URL
        fromService:
          name: familytask-api
          type: web
          property: host
    routes:
      # Réécrit toutes les routes vers index.html, nécessaire pour le routing côté client (Vue Router)
      - type: rewrite
        source: /*
        destination: /index.html
